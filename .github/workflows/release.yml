name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create Release PR or Publish to npm
        # Pinado numa versão exata (não @v1/@v2 flutuante): @v1 estava resolvendo pra um commit
        # antigo, com inputs em camelCase (publish, createGithubReleases) e detecção de tag via
        # regex no texto "New tag:" do stdout do "changeset publish" - formato que @changesets/cli
        # não imprime mais desde a UI baseada em Clack (spinners "Creating git tags..."). Resultado:
        # o publish no npm funcionava, mas nenhuma tag/Release era criada no GitHub, silenciosamente.
        # v2.1.1 usa inputs kebab-case (publish-script) e um mecanismo mais robusto (arquivo
        # CHANGESETS_OUTPUT), compatível com a versão do @changesets/cli instalada aqui.
        uses: changesets/action@v2.1.1
        with:
          publish-script: npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
